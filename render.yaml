services:
  - type: web
    name: kkobak-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: DB_DRIVER
        value: org.postgresql.Driver
      - key: JPA_DATABASE_PLATFORM
        value: org.hibernate.dialect.PostgreSQLDialect
      - key: JPA_DDL_AUTO
        value: validate
      - key: FLYWAY_ENABLED
        value: true
      - key: APP_STORAGE_MODE
        value: supabase
      - key: SUPABASE_STORAGE_BUCKET
        value: kkobak-media
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_DB_USERNAME
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_FRONTEND_URL
        sync: false
      - key: APP_PUSH_VAPID_PUBLIC_KEY
        sync: false
      - key: APP_PUSH_VAPID_PRIVATE_KEY
        sync: false
      - key: APP_PUSH_VAPID_SUBJECT
        sync: false
      - key: APP_NOTIFICATION_DISPATCH_SECRET
        generateValue: true
      - key: APP_ADMIN_USERNAME
        value: admin
      - key: APP_ADMIN_PASSWORD
        sync: false
