spring.application.name=kkobak-api
server.port=${PORT:8080}
server.forward-headers-strategy=framework

spring.datasource.url=${SUPABASE_DB_URL:jdbc:h2:file:./data/kkobak;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${SUPABASE_DB_USERNAME:sa}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.database-platform=${JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul
spring.jackson.time-zone=Asia/Seoul
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}
app.storage.mode=${APP_STORAGE_MODE:local}
app.storage.local-root=${APP_STORAGE_LOCAL_ROOT:uploads}
app.storage.local-public-base-url=${APP_STORAGE_LOCAL_PUBLIC_BASE_URL:http://localhost:8080/uploads}
app.storage.supabase-url=${SUPABASE_URL:}
app.storage.supabase-service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
app.storage.supabase-bucket=${SUPABASE_STORAGE_BUCKET:kkobak-media}
app.push.vapid.public-key=${APP_PUSH_VAPID_PUBLIC_KEY:}
app.push.vapid.private-key=${APP_PUSH_VAPID_PRIVATE_KEY:}
app.push.vapid.subject=${APP_PUSH_VAPID_SUBJECT:mailto:hello@kkobak.app}
app.notification.dispatch-secret=${APP_NOTIFICATION_DISPATCH_SECRET:local-development-secret}
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:}
