name: Sync public portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    if: github.repository == 'JUNHONGKIM95/kkobak'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: source

      - name: Check out the public portfolio repository
        uses: actions/checkout@v7
        with:
          repository: JUNHONGKIM95/kkobak-portfolio
          token: ${{ secrets.PORTFOLIO_REPO_TOKEN }}
          path: portfolio

      - name: Copy the current safe snapshot to the public repository
        run: |
          rsync -a --delete --exclude .git source/ portfolio/
          cd portfolio
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Sync from private source ${GITHUB_SHA::7}"
          git push origin HEAD:main
